<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#20283a">
<title>页面不存在 | 千音习谱</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 0%, #2b3450 0%, #20283a 46%, #161c29 100%);
    color: #e9e2d6; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 520px; width: 100%; text-align: center;
    padding: 44px 32px 38px; border-radius: 18px;
    background: rgba(24, 30, 45, .72);
    border: 1px solid rgba(226, 196, 138, .22);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
  }
  .mark { font-size: 15px; letter-spacing: .5em; color: #e2c48a; margin-bottom: 18px; }
  h1 { margin: 0 0 10px; font-size: 26px; font-weight: 600; letter-spacing: .04em; }
  p { margin: 0 auto 26px; max-width: 40ch; line-height: 1.75; color: #a9b0c0; font-size: 14px; }
  a {
    display: inline-block; padding: 11px 26px; border-radius: 999px;
    background: linear-gradient(135deg, #e2c48a, #c9a45f); color: #241d10;
    text-decoration: none; font-weight: 600; font-size: 14px; letter-spacing: .05em;
  }
  a:hover { filter: brightness(1.06); }
  .foot { margin-top: 24px; font-size: 12px; color: #6d768a; letter-spacing: .03em; }
</style>
</head>
<body>
  <main class="card">
    <div class="mark">404</div>
    <h1>这段谱子没找到</h1>
    <p>你要访问的页面不存在，或者地址拼错了。回到首页继续练谱吧。</p>
    <a href="/">返回首页</a>
    <div class="foot">千音习谱 · 练习模式 · 非官方项目</div>
  </main>
</body>
</html>
